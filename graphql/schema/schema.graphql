# CSG Attendance Tracker — GraphQL Schema (DataStore-compatible)
# Sprint 1 update: adds @model directives so Amplify's GraphQL Transformer
# auto-generates the sync tables/resolvers Amplify DataStore needs for
# offline sync. Field names/types unchanged from the Sprint 0 schema —
# this is an additive change, not a redesign.
#
# @model auto-adds: id, _version, _deleted, _lastChangedAt on every type,
# plus create/update/delete mutations, list/get queries, and subscriptions.
# We keep our own school_id / created_at / marked_at etc. as regular fields
# for the CSG-standard metadata and app logic; Amplify's _version/_deleted
# are separate, internal-to-DataStore fields — don't confuse the two.

type Student @model @auth(rules: [
  { allow: groups, groups: ["Admin", "HeadTeacher", "Teacher"], operations: [create, read, update, delete] }
  { allow: groups, groups: ["Parent"], operations: [read] }
]) {
  id: ID!
  school_id: ID! @index(name: "bySchool")
  first_name: String!
  last_name: String!
  class_id: ID @index(name: "byClass")
  guardian_phone: AWSPhone
  status: String
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
}

type Teacher @model @auth(rules: [
  { allow: groups, groups: ["Admin", "HeadTeacher"], operations: [create, read, update, delete] }
  { allow: groups, groups: ["Teacher"], operations: [read] }
]) {
  id: ID!
  school_id: ID! @index(name: "bySchool")
  first_name: String!
  last_name: String!
  email: AWSEmail
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
}

type Class @model @auth(rules: [
  { allow: groups, groups: ["Admin", "HeadTeacher"], operations: [create, read, update, delete] }
  { allow: groups, groups: ["Teacher"], operations: [read] }
]) {
  id: ID!
  school_id: ID! @index(name: "bySchool")
  name: String!
  grade: String!
  stream: String
  teacher_id: ID
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
}

type AttendanceRecord @model @auth(rules: [
  { allow: groups, groups: ["Admin", "HeadTeacher"], operations: [create, read, update, delete] }
  { allow: groups, groups: ["Teacher"], operations: [create, read, update] }
  { allow: groups, groups: ["Parent"], operations: [read] }
]) {
  id: ID!
  school_id: ID! @index(name: "bySchool")
  student_id: ID! @index(name: "byStudent")
  class_id: ID! @index(name: "byClassDate", sortKeyFields: ["date"])
  date: AWSDate!
  status: String!            # PRESENT | ABSENT | LATE
  reason_code: String
  marked_by: ID
  marked_at: AWSDateTime!
  sync_version: Int          # app-level version, separate from Amplify's internal _version
}

input MarkAttendanceInput {
  school_id: ID!
  student_id: ID!
  class_id: ID!
  date: AWSDate!
  status: String!
  marked_by: ID!
  marked_at: AWSDateTime!
  client_request_id: String!
}

type MarkAttendanceResult {
  id: ID!
  student_id: ID!
  status: String!
  marked_at: AWSDateTime!
}

type Mutation {
  markAttendance(input: MarkAttendanceInput!): MarkAttendanceResult
    @function(name: "markAttendanceFunction")

    sendAttendanceAlert(input: SendAttendanceAlertInput!): SendAlertResult
    @function(name: "sendSmsFunction")
    @auth(rules: [{ allow: groups, groups: ["Admin", "HeadTeacher", "Teacher"] }])

}

input GenerateAttendanceSummaryInput {
  school_id: ID!
  class_id: ID!
  start_date: AWSDate!
  end_date: AWSDate!
}

type AttendanceSummaryResult {
  summary: String!
  generated_at: AWSDateTime!
}



input PredictAttendanceRiskInput {
  student_id: ID!
}

type AttendanceRiskFeatures {
  overall_rate: Float!
  recent7_rate: Float!
  recent14_rate: Float!
  trend_recent14_minus_overall: Float!
  max_absence_streak: Int!
  active_absence_streak_at_cutoff: Int!
}

type AttendanceRiskResult {
  student_id: ID!
  risk_score: Float
  risk_level: String!
  reason: String!
  features: AttendanceRiskFeatures
  model_trained_at: AWSDateTime!
}

type Query {
  generateAttendanceSummary(input: GenerateAttendanceSummaryInput!): AttendanceSummaryResult
    @function(name: "attendanceSummaryFunction")
    @auth(rules: [{ allow: groups, groups: ["Admin", "HeadTeacher", "Teacher"] }])

  predictAttendanceRisk(input: PredictAttendanceRiskInput!): AttendanceRiskResult
    @function(name: "predictAttendanceRiskFunction")
    @auth(rules: [{ allow: groups, groups: ["Admin", "HeadTeacher", "Teacher"] }])
}

type NotificationLog @model @auth(rules: [
  { allow: groups, groups: ["Admin", "HeadTeacher"], operations: [create, read, update, delete] }
]) {
  id: ID!
  school_id: ID! @index(name: "bySchool")
  student_id: ID! @index(name: "byStudent")
  guardian_phone: AWSPhone!
  message: String!
  channel: String!
  status: String!
  sent_at: AWSDateTime
  created_at: AWSDateTime!
}

# Sprint 2 (issue #26): replaced allow:private with allow:groups rules
# matching Cognito groups (Admin/HeadTeacher/Teacher/Parent). This is
# group-level, not yet assignment-level -- a Teacher in the Teacher group
# can read/write for ANY class, not just their own assigned one, since no
# teacher-to-class assignment model exists yet. True per-assignment scoping
# (matching the CSG authorization matrix's "Assigned classes" column) is a
# known follow-up, not yet implemented.


input SendAttendanceAlertInput {
  school_id: ID!
  student_id: ID!
  guardian_phone: AWSPhone!
  message: String!
}

type SendAlertResult {
  success: Boolean!
  status: String!
  notification_id: ID!
}


